<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>CINEWEB</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <form onsubmit="return validarRegistro(event)">
            <h2 style="text-align: center; margin-bottom: 20px;">Crear Cuenta</h2>
            
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre">

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email">

            <label for="Edad">Edad</label>
            <input type="number" id="Edad">

            <label>Género</label>
            <div style="margin-bottom: 20px; margin-top: 10px;">
                <input type="radio" name="genero" id="m" checked> <label style="display:inline; margin-right: 20px; color: white;" for="m">Masculino</label>
                <input type="radio" name="genero" id="f"> <label style="display:inline; color: white;" for="f">Femenino</label>
            </div>

            <button type="submit" style="width: 100%; margin: 10px 0 10px 0;">Registrar</button>
            
            <p style="text-align: center; font-size: 14px; margin-top: 15px;">
                <a href="login.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
