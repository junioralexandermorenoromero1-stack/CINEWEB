<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEWEB - Crear Cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo">CINEWEB</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <form onsubmit="return validarRegistro(event)">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 25px; color: #e50914;">Formulario de Registro</h2>
            
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ej: Junior Moreno Romero" required>

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@uniminuto.edu.co" required>

            <label for="edad">Edad (Permitido de 10 a 85 años)</label>
            <input type="number" id="edad" placeholder="Ej: 21" required>

            <label>Género</label>
            <div style="margin-bottom: 25px; margin-top: 10px; display: flex; gap: 20px;">
                <label style="display:inline; color: white; cursor: pointer;">
                    <input type="radio" name="genero" id="m" checked style="margin-right: 5px;"> Masculino
                </label>
                <label style="display:inline; color: white; cursor: pointer;">
                    <input type="radio" name="genero" id="f" style="margin-right: 5px;"> Femenino
                </label>
            </div>

            <button type="submit" style="margin-bottom: 15px;">Crear Cuenta Nueva</button>
            
            <p style="text-align: center; font-size: 14px; margin: 0;">
                <a href="login.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿Ya eres miembro? Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CINEWEB | Proyecto Final Programación Web | Estudiante: Junior Moreno Romero - UNIMINUTO</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
