<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEWEB - Crear Cuenta</title>
    <style>
        :root {
            --rojo: #e50914;
            --negro: #141414;
            --gris-oscuro: #1f1f1f;
            --gris-medio: #333333;
            --blanco: #ffffff;
        }

        body {
            background-color: var(--negro);
            color: var(--blanco);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rojo);
        }

        .logo {
            color: var(--rojo);
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        form {
            background-color: #000000;
            padding: 35px;
            border-radius: 10px;
            max-width: 400px;
            margin: 50px auto;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
        }

        form input[type="text"], form input[type="email"], form input[type="number"], form input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: var(--gris-medio);
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        form input:focus { outline: none; border-color: var(--rojo); }

        button {
            background-color: var(--rojo);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover { background-color: #b80710; }

        footer {
            background-color: #000;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #737373;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CINEWEB</div>
    </header>

    <main>
        <form onsubmit="return ejecutarRegistro(event)">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 25px; color: #e50914;">Formulario de Registro</h2>
            
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ej: Junior Moreno Romero" required>

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@uniminuto.edu.co" required>

            <label for="edad">Edad (Permitido de 10 a 85 años)</label>
            <input type="number" id="edad" placeholder="Ej: 21" required>

            <label>Género</label>
            <div style="margin-bottom: 25px; margin-top: 10px; display: flex; gap: 20px;">
                <label style="display:inline; color: white; cursor: pointer;">
                    <input type="radio" name="genero" id="m" checked style="margin-right: 5px;"> Masculino
                </label>
                <label style="display:inline; color: white; cursor: pointer;">
                    <input type="radio" name="genero" id="f" style="margin-right: 5px;"> Femenino
                </label>
            </div>

            <button type="submit" style="margin-bottom: 15px;">Crear Cuenta Nueva</button>
            
            <p style="text-align: center; font-size: 14px; margin: 0;">
                <a href="index.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿Ya eres miembro? Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CINEWEB | Proyecto Final Programación Web | Estudiante: Junior Moreno Romero - UNIMINUTO</p>
    </footer>

    <script>
        function ejecutarRegistro(event) {
            event.preventDefault();
            var nombre = document.getElementById("nombre").value.trim();
            var edad = parseInt(document.getElementById("edad").value, 10);

            if (nombre === "" || isNaN(edad)) {
                alert("Por favor, complete todos los campos obligatorios.");
                return false;
            }
            
            if (edad < 10 || edad > 85) {
                alert("Registro rechazado: La edad reglamentaria debe estar entre los 10 y los 85 años.");
                return false;
            }
            
            alert("¡Registro completado con éxito! Bienvenido a CINEWEB. Ahora inicia sesión.");
            window.location.href = "index.html"; // Redirige al login principal
            return false;
        }
    </script>
</body>
</html>
