<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEWEB - Comunidad Cinéfila</title>
    <style>
        :root {
            --rojo: #e50914;
            --negro: #141414;
            --gris-oscuro: #1f1f1f;
            --gris-medio: #333333;
            --blanco: #ffffff;
        }

        body {
            background-color: var(--negro);
            color: var(--blanco);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rojo);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: var(--rojo);
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover { color: var(--blanco); }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: #ccc; margin-top: 0; }

        .layout-comunidad {
            display: flex;
            gap: 30px;
            padding: 30px 5%;
            flex-wrap: wrap;
        }

        .seccion-peliculas { flex: 2; min-width: 320px; }
        .panel-interactivo { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 25px; }

        .seccion-titulo { font-size: 1.8rem; margin-bottom: 15px; border-left: 4px solid var(--rojo); padding-left: 10px; }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--gris-oscuro);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; height: 340px; object-fit: cover; background-color: var(--gris-medio); }
        .info { padding: 15px; }
        .info h3 { margin: 0 0 10px 0; color: var(--rojo); font-size: 18px; }
        .info p { margin: 5px 0; font-size: 14px; color: #bbb; line-height: 1.4; }

        .caja-herramienta {
            background: var(--gris-oscuro);
            padding: 25px;
            border-radius: 8px;
            border-top: 4px solid var(--rojo);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .caja-herramienta h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }

        form label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }

        form input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: var(--gris-medio);
            border: 1px solid #444;
            color: white
