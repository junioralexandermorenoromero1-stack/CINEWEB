<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEWEB - Iniciar Sesión</title>
    <style>
        :root {
            --rojo: #e50914;
            --negro: #141414;
            --gris-oscuro: #1f1f1f;
            --gris-medio: #333333;
            --blanco: #ffffff;
        }

        body {
            background-color: var(--negro);
            color: var(--blanco);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--rojo);
        }

        .logo {
            color: var(--rojo);
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        form {
            background-color: #000000;
            padding: 35px;
            border-radius: 10px;
            max-width: 400px;
            margin: 80px auto;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
        }

        form input[type="text"], form input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: var(--gris-medio);
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--rojo);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover { background-color: #b80710; }

        footer {
            background-color: #000;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #737373;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CINEWEB</div>
    </header>

    <main>
        <form onsubmit="return ejecutarLogin(event)">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 25px; color: #e50914;">Inicio de Sesión</h2>
            
            <label for="usuario">Usuario o Correo Electrónico</label>
            <input type="text" id="usuario" placeholder="Ej: junior_moreno" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit" style="margin-top: 10px; margin-bottom: 20px;">Ingresar al Sistema</button>
            
            <p style="text-align: center; font-size: 14px; margin: 0;">
                <a href="registro.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿No tienes cuenta todavía? Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CINEWEB | Proyecto Final Programación Web | Estudiante: Junior Moreno Romero - UNIMINUTO</p>
    </footer>

    <script>
        function ejecutarLogin(event) {
            event.preventDefault(); 
            var usuario = document.getElementById("usuario").value.trim();
            var pass = document.getElementById("password").value.trim();

            if (usuario === "" || pass === "") {
                alert("Por favor, ingrese sus credenciales completas.");
                return false;
            }
            
            alert("¡Inicio de sesión exitoso! Bienvenido al sistema interactivo de CINEWEB.");
            
            // Te manda directo a la cartelera protegida
            window.location.href = "cartelera.html";
            return false;
        }
    </script>
</body>
</html>
