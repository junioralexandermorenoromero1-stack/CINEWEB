<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINETOP - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo">CINETOP</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <form onsubmit="return validarLogin(event)">
            <h2 style="text-align: center; margin-bottom: 20px;">Inicio de Sesión</h2>
            
            <label for="usuario">Usuario / Correo</label>
            <input type="text" id="usuario">

            <label for="password">Contraseña</label>
            <input type="password" id="password">

            <button type="submit" style="width: 100%; margin: 10px 0 20px 0;">Ingresar</button>
            
            <p style="text-align: center; font-size: 14px; margin: 0;">
                <a href="registro.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿No tienes cuenta? Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CINETOP | Proyecto Final | Estudiante: Junior Moreno Romero - UNIMINUTO</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
