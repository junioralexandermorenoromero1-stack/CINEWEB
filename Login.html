<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>CINEWEB</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <form onsubmit="return validarLogin(event)">
            <h2 style="text-align: center; margin-bottom: 20px;">Inicio de Sesión</h2>
            
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario">

            <label for="password">Contraseña</label>
            <input type="password" id="password">

            <button type="submit" style="width: 100%; margin: 10px 0 20px 0;">Ingresar</button>
            
            <p style="text-align: center; font-size: 14px; margin: 0;">
                <a href="registro.html" style="color: #e50914; text-decoration: none; font-weight: bold;">¿No tienes cuenta? Regístrate aquí</a>
            </p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
